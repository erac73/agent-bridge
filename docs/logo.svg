<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff0080"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Glow ring -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.3" filter="url(#blur)"/>
  <!-- Connection lines (PC to Server) -->
  <line x1="25" y1="45" x2="55" y2="60" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="60" x2="55" y2="60" stroke="#7b2ff7" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="75" x2="55" y2="60" stroke="#ff0080" stroke-width="1.5" opacity="0.6"/>
  <!-- Data packets -->
  <circle cx="38" cy="48" r="2.5" fill="#00d4ff"/>
  <circle cx="38" cy="60" r="2.5" fill="#7b2ff7"/>
  <circle cx="38" cy="72" r="2.5" fill="#ff0080"/>
  <!-- PC Monitor -->
  <rect x="14" y="38" width="22" height="16" rx="3" fill="none" stroke="url(#glow2)" stroke-width="1.8"/>
  <rect x="17" y="41" width="16" height="10" rx="1" fill="#00d4ff" opacity="0.15"/>
  <line x1="22" y1="54" x2="28" y2="54" stroke="url(#glow2)" stroke-width="1.2"/>
  <line x1="25" y1="54" x2="25" y2="57" stroke="url(#glow2)" stroke-width="1.2"/>
  <rect x="20" y="57" width="10" height="2" rx="1" fill="url(#glow2)" opacity="0.5"/>
  <!-- Server -->
  <rect x="56" y="40" width="32" height="24" rx="4" fill="none" stroke="url(#glow)" stroke-width="1.8"/>
  <rect x="59" y="43" width="26" height="5" rx="2" fill="#00d4ff" opacity="0.1"/>
  <circle cx="62" cy="45.5" r="1.2" fill="#00ff88"/>
  <circle cx="66" cy="45.5" r="1.2" fill="#ffaa00"/>
  <rect x="59" y="50" width="26" height="5" rx="2" fill="#7b2ff7" opacity="0.1"/>
  <circle cx="62" cy="52.5" r="1.2" fill="#00ff88"/>
  <circle cx="66" cy="52.5" r="1.2" fill="#00ff88"/>
  <rect x="59" y="57" width="26" height="5" rx="2" fill="#ff0080" opacity="0.1"/>
  <circle cx="62" cy="59.5" r="1.2" fill="#ff4444"/>
  <circle cx="66" cy="59.5" r="1.2" fill="#00ff88"/>
  <!-- Cloud / Network -->
  <ellipse cx="95" cy="60" rx="16" ry="10" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.4" stroke-dasharray="3 2"/>
  <!-- Arrows -->
  <path d="M 50 55 L 55 60 L 50 65" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
  <path d="M 70 55 L 75 60 L 70 65" fill="none" stroke="#ff0080" stroke-width="1.2" opacity="0.5"/>
  <!-- Dots decoration -->
  <circle cx="18" cy="90" r="1" fill="#00d4ff" opacity="0.4"/>
  <circle cx="26" cy="95" r="1" fill="#7b2ff7" opacity="0.4"/>
  <circle cx="34" cy="88" r="1" fill="#ff0080" opacity="0.4"/>
  <circle cx="90" cy="25" r="1" fill="#00d4ff" opacity="0.4"/>
  <circle cx="98" cy="30" r="1" fill="#7b2ff7" opacity="0.4"/>
  <circle cx="106" cy="22" r="1" fill="#ff0080" opacity="0.4"/>
</svg>
